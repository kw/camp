[project]
name = "camp"
version = "0.1.0"
description = ""
authors = [{ name = "Kel Moriarty", email = "kel@kmoriarty.dev" }]
requires-python = ">=3.12.0,<4"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "crispy-bootstrap5>=2024.2,<2025",
    "django>=5.2.8,<6",
    "django-allauth[socialaccount]>=65.14,<66",
    "django-crispy-forms>=2.1,<3",
    "django-debug-toolbar>=4.3.0,<5",
    "whitenoise>=6.6.0,<7",
    "environs[django]>=11.0.0,<12",
    "gunicorn>=23.0.0,<24",
    "rules>=3.3,<4",
    "pydantic>=2.1.1,<3",
    "pyyaml>=6.0,<7",
    "markdown>=3.4.3,<4",
    "nh3>=0.2.13,<0.3",
    "sentry-sdk>=2.8.0,<3",
    "django-htmx>=1.17.2,<2",
    "xlsxwriter>=3.1.9,<4",
    "time-machine>=2.13.0,<3",
    "httpx[http2]>=0.27.0,<0.28",
    "puremagic>=1.21,<2",
    "camp-engine",
    "django-recaptcha>=4.0.0,<5",
    "psycopg[binary]>=3.1,<4",
]

[dependency-groups]
dev = [
    "ipython~=8.2",
    "pre-commit",
    "pytest>=7.1,<8",
    "pytest-django>=4.8.0,<5",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
camp-engine = { git = "https://github.com/kw/camp-engine.git" }

[tool.uv.build-backend]
module-name = ["camp"]
module-root = ""
namespace = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.isort]
profile = "black"
force_single_line = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'config.settings'
python_files = ["tests.py", "test_*.py", "*_tests.py", "*_test.py"]
testpaths = ["tests"]
